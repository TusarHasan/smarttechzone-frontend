    <style>
        .part-categories-section { padding: 30px 0; background: #fff; }
        .part-cat-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px; margin-top: 16px;
        }
        .part-cat-card {
            text-align: center; cursor: pointer; padding: 10px 6px; border-radius: 8px;
            transition: background 0.15s;
        }
        .part-cat-card:hover { background: #f7f7f7; }
        .part-cat-icon {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px;
            overflow: hidden; border: 1px solid #eee; background: #fafafa;
            display: flex; align-items: center; justify-content: center;
        }
        .part-cat-icon img { width: 100%; height: 100%; object-fit: cover; }
        .part-cat-name { font-size: 12px; color: #333; line-height: 1.3; }
        .part-cat-count { font-size: 11px; color: #999; }
        .active-category-banner {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            background: #fdf1f0; border: 1px solid #f5c6c0; border-radius: 6px; margin-bottom: 16px;
            font-size: 14px; color: #333;
        }
        .active-category-banner a { color: #e74c3c; font-weight: bold; text-decoration: none; }
        .load-more-wrapper { text-align: center; margin: 30px 0; }
        .load-more-btn {
            background: #fff; border: 1px solid #e74c3c; color: #e74c3c; padding: 10px 32px;
            border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .load-more-btn:hover { background: #fdf1f0; }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #product-list { transition: opacity 0.2s ease; }
        #product-list.fading { opacity: 0.3; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeInUp 0.35s ease both; }
    </style>
    <script src="config.js"></script>
    <script src="customer-auth.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="chat-widget.js"></script>
</head>
<body>

<div class="hero">
        <h1>বাংলাদেশের সর্ববৃহৎ মোবাইল রিপ্লেসমেন্ট পার্টস স্টোর</h1>
        <p>Find parts for any phone — fast delivery across Bangladesh</p>
        <a href="#" class="hero-btn">Shop Now</a>
    </div>

    <section class="part-categories-section">
        <div class="container">
            <h2 class="section-title">Categories</h2>
            <p class="section-subtitle">যেই পার্টস দরকার সেটা বেছে নিন</p>
            <div class="part-cat-grid" id="partCategoryGrid"></div>
        </div>
    </section>

    <section class="category-section">
        <section class="products-section">
    <div class="container">
        <h2 class="section-title" id="productsSectionTitle">Latest Products</h2>
        <div id="categoryBanner"></div>
        <div id="product-list"></div>
        <div class="load-more-wrapper" id="loadMoreWrapper" style="display:none;">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreProducts()">Load More</button>
        </div>
    </div>
</section>
        <div class="container">
            <h2 class="section-title">Shop by Brand</h2>
            <p class="section-subtitle">আপনার ফোনের Brand বেছে নিন</p>

            <!-- এই গ্রিডটা এখন ডাইনামিক — /api/products/brand-counts থেকে যেসব ব্র্যান্ডে অন্তত ১টা published
                 প্রোডাক্ট আছে সেগুলোই এখানে দেখাবে। নতুন কোনো ব্র্যান্ড (itel, Nothing ইত্যাদি) ডিটেক্ট হয়ে
                 প্রোডাক্ট পাবলিশ হলে এখানে আপনাআপনি যোগ হয়ে যাবে, কোনো ফাইল বদলাতে হবে না। -->
            <div class="category-grid" id="brandGrid">
                <p style="grid-column: 1/-1; text-align:center; color:#999;">লোড হচ্ছে...</p>
            </div>
        </div>
    </section>

    <div id="siteFooter"></div>
    <script src="footer.js"></script>
    <script src="search.js"></script>


    <script>
        const API_BASE = BACKEND_URL;

        // ============ Category ও Brand গ্রিড — এখন backend aggregation endpoint থেকে সরাসরি কাউন্ট/ছবি
        // আসে (হাজার হাজার প্রোডাক্ট ব্রাউজারে ডাউনলোড করে হিসেব করতে হয় না, তাই অনেক দ্রুত) ============
        function resolveImg(url) {
            if (!url) return 'https://via.placeholder.com/200';
            return url.startsWith('http') ? url : `${API_BASE}${url}`;
        }

        async function renderCategoryGrid() {
            const grid = document.getElementById('partCategoryGrid');
            try {
                const res = await fetch(`${API_BASE}/api/products/category-counts`);
                const rows = await res.json();
                grid.innerHTML = rows.map(r => {
                    const img = r.image ? resolveImg(r.image) : 'https://via.placeholder.com/64?text=%20';
                    return `
                        <div class="part-cat-card" onclick="goToCategory('${r.name.replace(/'/g, "\\'")}')">
                            <div class="part-cat-icon"><img src="${img}" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/64?text=%20'"></div>
                            <div class="part-cat-name">${r.name}</div>
                            <div class="part-cat-count">${r.count} items</div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '';
            }
        }

        async function renderBrandGrid() {
            const grid = document.getElementById('brandGrid');
            try {
                const res = await fetch(`${API_BASE}/api/products/brand-counts`);
                const rows = await res.json();
                grid.innerHTML = rows.map(r => {
                    const img = r.image ? resolveImg(r.image) : 'https://via.placeholder.com/80?text=%20';
                    return `
                        <a href="brands/brand.html?name=${encodeURIComponent(r.name)}" class="category-card">
                            <div class="category-icon"><img src="${img}" alt="${r.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/80?text=%20'"></div>
                            <h3>${r.name}</h3>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '';
            }
        }

        // ============ প্রোডাক্ট লিস্ট — এখন সার্ভার-সাইড pagination ব্যবহার করে, প্রথমেই মাত্র ১২টা আনে,
        // Load More চাপলে পরের ব্যাচ আনে (আগে পুরো ক্যাটালগ একসাথে ডাউনলোড হয়ে ব্রাউজারে ভাগ হতো) ============
        let currentPage = 1;
        let totalPages = 1;
        let currentCategory = null;
        const PAGE_SIZE = 12;

        async function loadHomeProducts() {
            renderCategoryGrid();
            renderBrandGrid();
            applyCategoryFilterFromUrl();
        }

        function goToCategory(catName) {
            const newUrl = `index.html?category=${encodeURIComponent(catName)}`;
            history.pushState({ category: catName }, '', newUrl);
            applyCategoryFilterFromUrl();
        }

        function clearCategory(e) {
            e.preventDefault();
            history.pushState({}, '', 'index.html');
            applyCategoryFilterFromUrl();
        }

        // ব্রাউজারের Back/Forward বাটনেও ঠিকভাবে কাজ করার জন্য
        window.addEventListener('popstate', () => applyCategoryFilterFromUrl());

        async function applyCategoryFilterFromUrl() {
            const params = new URLSearchParams(window.location.search);
            currentCategory = params.get('category');
            const titleEl = document.getElementById('productsSectionTitle');
            const banner = document.getElementById('categoryBanner');

            titleEl.textContent = currentCategory || 'Latest Products';
            if (!currentCategory) banner.innerHTML = '';

            const listEl = document.getElementById('product-list');
            listEl.classList.add('fading');
            currentPage = 1;
            await loadProductsPage();
            listEl.classList.remove('fading');

            // ক্যাটাগরি সিলেক্ট থাকলে স্বয়ংক্রিয়ভাবে প্রোডাক্ট লিস্টের কাছে স্ক্রল করা,
            // যাতে ক্লিক করার পর কাস্টমারকে আবার হাতে করে স্ক্রল করতে না হয়
            if (currentCategory) {
                setTimeout(() => titleEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
            }
        }

        async function loadProductsPage() {
            const container = document.getElementById('product-list');
            const banner = document.getElementById('categoryBanner');
            try {
                const qs = new URLSearchParams({ status: 'published', fields: 'summary', page: currentPage, limit: PAGE_SIZE });
                if (currentCategory) qs.set('category', currentCategory);

                const res = await fetch(`${API_BASE}/api/products?${qs.toString()}`);
                const data = await res.json();
                totalPages = data.totalPages || 1;

                if (currentCategory) {
                    banner.innerHTML = `<div class="active-category-banner">
                        দেখাচ্ছে: <b>${currentCategory}</b> (${data.total}টি) — <a href="index.html" onclick="clearCategory(event)">সব প্রোডাক্ট দেখুন</a>
                    </div>`;
                }

                if (currentPage === 1) container.innerHTML = '';

                const items = data.products || [];
                if (currentPage === 1 && items.length === 0) {
                    container.innerHTML = '<p>এই ক্যাটাগরিতে কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
                } else {
                    renderProductCards(items);
                }

                const loadMoreWrapper = document.getElementById('loadMoreWrapper');
                loadMoreWrapper.style.display = currentPage < totalPages ? 'block' : 'none';
            } catch (err) {
                console.error('Error loading products:', err);
                container.innerHTML = '<p>প্রোডাক্ট লোড করা সম্ভব হয়নি।</p>';
            }
        }

        function renderProductCards(items) {
            const container = document.getElementById('product-list');
            items.forEach(p => {
                const imgUrl = (p.images && p.images.length > 0) ? resolveImg(p.images[0]) : 'https://via.placeholder.com/200';
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cssText = 'border: 1px solid #ddd; padding: 10px; border-radius: 5px; cursor: pointer; margin: 10px; display: inline-block; width: 200px; vertical-align: top;';
                card.onclick = () => window.location.href = `product.html?id=${p._id}`;
                card.innerHTML = `
                    <img src="${imgUrl}" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/200'" style="width: 100%; height: 150px; object-fit: contain;">
                    <h4>${p.name}</h4>
                    <p>৳ ${p.price}</p>
                `;
                container.appendChild(card);
            });
        }

        function loadMoreProducts() {
            currentPage++;
            loadProductsPage();
        }

        loadHomeProducts();
    </script>
</body>
