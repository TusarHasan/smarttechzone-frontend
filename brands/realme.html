<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realme Parts - Smart Tech Zone</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .load-more-wrapper { text-align: center; margin: 30px 0; }
        .load-more-btn {
            background: #fff; border: 1px solid #e74c3c; color: #e74c3c; padding: 10px 32px;
            border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700;
        }
        .load-more-btn:hover { background: #fdf1f0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeInUp 0.35s ease both; }
        .brand-product-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
        }
        @media (max-width: 992px) { .brand-product-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 576px) { .brand-product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    </style>
    <script src="../config.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="../index.html" class="logo"><img src="../images/logo.png" alt="Smart Tech Zone"></a>
        <div class="search-bar">
            <input type="text" placeholder="Search for parts...">
            <button>Search</button>
        </div>
        <div class="nav-icons">
            <a href="#">Login</a>
            <a href="#">Cart (0)</a>
        </div>
    </nav>

    <div class="brand-header">
        <div class="breadcrumb">
            <a href="../index.html">Home</a> / <span>Realme</span>
        </div>
        <h1>Realme Replacement Parts</h1>
        <p>আপনার Realme ফোনের জন্য উপযুক্ত পার্টস</p>
    </div>

    <section class="product-section">
        <div class="container">
            <div class="brand-product-grid" id="brandProductGrid">
                <p style="grid-column: 1/-1; text-align:center; color:#999;">লোড হচ্ছে...</p>
            </div>
            <div class="load-more-wrapper" id="loadMoreWrapper" style="display:none;">
                <button class="load-more-btn" id="loadMoreBtn" onclick="renderNextPage()">Load More</button>
            </div>
        </div>
    </section>

    <div id="siteFooter"></div>
    <script src="../footer.js"></script>
    <script src="../search.js"></script>

    <script>
        const API_BASE = BACKEND_URL;
        const TARGET_BRAND = 'Realme';

        // ফোন-ব্র্যান্ড সনাক্ত করার keyword — একই নিয়ম যেভাবে Categories এ ব্যবহার হয়েছে
        const BRAND_KEYWORDS = {
            'Samsung': ['samsung', 'galaxy'],
            'Xiaomi': ['xiaomi', 'redmi', 'poco'],
            'Apple': ['iphone', 'apple'],
            'Oppo': ['oppo'],
            'Vivo': ['vivo'],
            'Realme': ['realme'],
            'Nokia': ['nokia'],
            'Symphony': ['symphony'],
        };

        function detectPhoneBrand(name) {
            const n = (name || '').toLowerCase();
            for (const [brand, keywords] of Object.entries(BRAND_KEYWORDS)) {
                if (keywords.some(k => n.includes(k))) return brand;
            }
            return null;
        }

        function resolveImg(url) {
            if (!url) return 'https://via.placeholder.com/200';
            return url.startsWith('http') ? url : `${API_BASE}${url}`;
        }

        let filteredProducts = [];
        let currentPage = 0;
        const PAGE_SIZE = 24;

        async function loadBrandProducts() {
            const grid = document.getElementById('brandProductGrid');
            try {
                const res = await fetch(`${API_BASE}/api/products?status=published`);
                const allProducts = await res.json();

                filteredProducts = allProducts.filter(p => detectPhoneBrand(p.name) === TARGET_BRAND);

                if (filteredProducts.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">এই ব্র্যান্ডের জন্য এখনো কোনো প্রোডাক্ট যোগ করা হয়নি।</p>';
                    return;
                }

                grid.innerHTML = '';
                renderNextPage();
            } catch (err) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">প্রোডাক্ট লোড করতে সমস্যা হয়েছে।</p>';
            }
        }

        function renderNextPage() {
            const grid = document.getElementById('brandProductGrid');
            const start = currentPage * PAGE_SIZE;
            const pageItems = filteredProducts.slice(start, start + PAGE_SIZE);

            pageItems.forEach(p => {
                const imgUrl = (p.images && p.images.length > 0) ? resolveImg(p.images[0]) : 'https://via.placeholder.com/200';
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cursor = 'pointer';
                card.onclick = () => window.location.href = `../product.html?id=${p._id}`;
                card.innerHTML = `
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/200'">
                    <h3>${p.name}</h3>
                    <div class="price">৳ ${p.price}</div>
                `;
                grid.appendChild(card);
            });

            currentPage++;
            const hasMore = currentPage * PAGE_SIZE < filteredProducts.length;
            document.getElementById('loadMoreWrapper').style.display = hasMore ? 'block' : 'none';
        }

        loadBrandProducts();
    </script>
</body>
</html>
