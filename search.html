<!DOCTYPE html>
<html lang="en">
<head>
    <script src="analytics.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Smart Tech Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .load-more-wrapper { text-align: center; margin: 30px 0; }
        .load-more-btn {
            background: #fff; border: 1px solid #e74c3c; color: #e74c3c; padding: 10px 32px;
            border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700;
        }
        .load-more-btn:hover { background: #fdf1f0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeInUp 0.35s ease both; }
    </style>
    <script src="config.js"></script>
    <script src="customer-auth.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="chat-widget.js"></script>
    <script src="cart.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo"><img src="images/logo.png" alt="Smart Tech Zone"></a>
        <div class="search-bar">
            <input type="text" placeholder="Search for parts...">
            <button>Search</button>
        </div>
        <div class="nav-icons">
            <span id="navAuthArea"><a href="login.html">Login</a></span>
            <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
        </div>
    </nav>

    <div class="brand-header">
        <div class="breadcrumb">
            <a href="index.html">Home</a> / <span>Search</span>
        </div>
        <h1 id="searchTitle">সার্চ ফলাফল</h1>
        <p id="searchSubtitle">&nbsp;</p>
    </div>

    <section class="product-section">
        <div class="container">
            <div class="product-grid" id="searchGrid">
                <p style="grid-column: 1/-1; text-align:center; color:#999;">লোড হচ্ছে...</p>
            </div>
            <div class="load-more-wrapper" id="loadMoreWrapper" style="display:none;">
                <button class="load-more-btn" id="loadMoreBtn" onclick="renderNextPage()">Load More</button>
            </div>
        </div>
    </section>

    <div id="siteFooter"></div>
    <script src="footer.js"></script>
    <script src="search.js"></script>

    <script>
        const API_BASE = BACKEND_URL;
        const params = new URLSearchParams(window.location.search);
        const QUERY = (params.get('q') || '').trim();

        function resolveImg(url) {
            if (!url) return 'https://via.placeholder.com/200';
            return url.startsWith('http') ? url : `${API_BASE}${url}`;
        }

        function quickAddToCart(productId, name, price, image) {
            addToCart({ productId, name, price, variantLabel: '', image, quantity: 1 });
            alert('কার্টে যোগ করা হয়েছে ✅');
        }

        let currentPage = 1;
        let totalPages = 1;
        const PAGE_SIZE = 24;

        async function loadSearchResults() {
            const grid = document.getElementById('searchGrid');
            const titleEl = document.getElementById('searchTitle');
            const subtitleEl = document.getElementById('searchSubtitle');

            if (!QUERY) {
                titleEl.textContent = 'সার্চ ফলাফল';
                subtitleEl.textContent = 'কিছু খুঁজতে উপরের বক্সে লিখুন';
                grid.innerHTML = '';
                return;
            }

            titleEl.textContent = `"${QUERY}" এর ফলাফল`;
            currentPage = 1;
            await loadSearchPage();
        }

        async function loadSearchPage() {
            const grid = document.getElementById('searchGrid');
            const subtitleEl = document.getElementById('searchSubtitle');
            try {
                // পুরো ক্যাটালগ ব্রাউজারে এনে ক্লায়েন্ট-সাইডে ফিল্টার করার বদলে ব্যাকএন্ডের search+pagination
                // ব্যবহার করা হচ্ছে — নাম/SKU/ব্র্যান্ড/মডেল সবগুলোতেই মিলিয়ে দেখে (fields=summary: ছোট পেলোড)
                const qs = new URLSearchParams({ status: 'published', fields: 'summary', search: QUERY, page: currentPage, limit: PAGE_SIZE });
                const res = await fetch(`${API_BASE}/api/products?${qs.toString()}`);
                const data = await res.json();
                totalPages = data.totalPages || 1;

                subtitleEl.textContent = `${data.total || 0} টি প্রোডাক্ট পাওয়া গেছে`;

                if (currentPage === 1) grid.innerHTML = '';

                const items = data.products || [];
                if (currentPage === 1 && items.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">কোনো প্রোডাক্ট পাওয়া যায়নি। অন্য কিছু লিখে খুঁজে দেখুন।</p>';
                    document.getElementById('loadMoreWrapper').style.display = 'none';
                    return;
                }

                renderItems(items);
                document.getElementById('loadMoreWrapper').style.display = currentPage < totalPages ? 'block' : 'none';
            } catch (err) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">সার্চ করতে সমস্যা হয়েছে।</p>';
            }
        }

        function renderItems(items) {
            const grid = document.getElementById('searchGrid');
            items.forEach(p => {
                const imgUrl = (p.images && p.images.length > 0) ? resolveImg(p.images[0]) : 'https://via.placeholder.com/200';
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cursor = 'pointer';
                card.onclick = () => window.location.href = `product.html?id=${p._id}`;
                card.innerHTML = `
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/200'">
                    <h3>${p.name}</h3>
                    <div class="price">৳ ${p.price}</div>
                    <button onclick="event.stopPropagation(); quickAddToCart('${p._id}', '${(p.name || '').replace(/'/g, "\\'")}', ${p.price}, '${imgUrl}')" style="width:100%; background:#e74c3c; color:#fff; border:none; padding:6px; border-radius:4px; cursor:pointer; font-size:13px; margin-top:6px;">Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        function renderNextPage() {
            currentPage++;
            loadSearchPage();
        }

        loadSearchResults();
    </script>
</body>
</html>
